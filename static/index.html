<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gotcha Week</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      background: #f5f5f5;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #111;
        color: #f0f0f0;
      }
      .card {
        background: #1f1f1f;
        border-color: #333;
      }
      input, textarea, button, select {
        background: #2a2a2a;
        color: #f0f0f0;
        border-color: #444;
      }
      table {
        color: inherit;
      }
    }
    .container {
      flex: 1;
      max-width: 960px;
      margin: auto;
      padding: 2rem 1.5rem 4rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 1.25rem;
      background: #fff;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08);
    }
    .nav-tabs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .nav-tabs .tab {
      border: 1px solid transparent;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      background: #e2e8f0;
      color: #1f2937;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-tabs .tab.active {
      background: #2563eb;
      color: white;
      border-color: #1d4ed8;
    }
    .page.hidden {
      display: none;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(37, 99, 235, 0.25);
      background: #cbd5f5;
    }
    .avatar.small {
      width: 40px;
      height: 40px;
      border-width: 1px;
      margin-right: 0.5rem;
    }
    .profile-top {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .upload-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .nickname-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .small-handle {
      margin-left: 0.4rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .zap-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
      display: none;
    }
    .zap-layer.active {
      display: block;
    }
    .zap-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 65%);
      animation: flash 5s ease-out forwards;
    }
    .zap-bolt {
      position: absolute;
      width: 4px;
      height: 80vh;
      top: -20vh;
      left: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #facc15 30%, #f97316 70%, rgba(255,255,255,0) 100%);
      filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.8));
      transform-origin: top;
      animation: bolt 0.6s ease-out forwards;
    }
    @keyframes flash {
      0% { opacity: 0; }
      5% { opacity: 1; }
      12% { opacity: 0.3; }
      20% { opacity: 0; }
      40% { opacity: 0.25; }
      50% { opacity: 0.05; }
      70% { opacity: 0.2; }
      100% { opacity: 0; }
    }
    @keyframes bolt {
      0% {
        opacity: 0;
        transform: translateX(0) scaleY(0.4) skewX(0deg);
      }
      20% {
        opacity: 1;
        transform: translateX(var(--bolt-x)) scaleY(1) skewX(var(--bolt-skew));
      }
      100% {
        opacity: 0;
        transform: translateX(calc(var(--bolt-x) * 0.6)) scaleY(0.3) skewX(calc(var(--bolt-skew) * 0.5));
      }
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button.secondary {
      background: #475569;
    }
    button.danger {
      background: #dc2626;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button.secondary:hover:not(:disabled) {
      background: #334155;
    }
    button.danger:hover:not(:disabled) {
      background: #b91c1c;
    }
    .hidden {
      display: none !important;
    }
    .status {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: #dbeafe;
      color: #1e3a8a;
    }
    .status.error {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status.success {
      background: #dcfce7;
      color: #166534;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
      font-size: 0.95rem;
    }
    th, td {
      padding: 0.5rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: rgba(37, 99, 235, 0.1);
    }
    .leaderboard-rank {
      font-weight: 600;
    }
    .flex {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }
    #target-name {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .muted {
      color: #64748b;
      font-size: 0.9rem;
    }
    .admin-only {
      border: 1px dashed #2563eb;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Gotcha Week</h1>

    <div id="status" class="status hidden"></div>
    <div id="zap-layer" class="zap-layer"></div>

    <section id="auth-section" class="grid two">
      <div class="card">
        <h2>Register</h2>
        <form id="register-form">
          <label for="register-name">Name</label>
          <input id="register-name" name="name" placeholder="Player name" required>
          <label for="register-password">Password <span class="muted">(6-72 chars)</span></label>
          <input id="register-password" name="password" type="password" placeholder="Choose a password" minlength="6" maxlength="72" required>
          <label for="register-secret">Admin Secret <span class="muted">(optional)</span></label>
          <input id="register-secret" name="admin_secret" placeholder="Admin secret if you are an admin">
          <button type="submit">Register</button>
        </form>
      </div>
      <div class="card">
        <h2>Login</h2>
        <form id="login-form">
          <label for="login-name">Name</label>
          <input id="login-name" name="name" placeholder="Player name" required>
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="Your password" maxlength="72" required>
          <button type="submit">Login</button>
        </form>
      </div>
    </section>

    <section id="game-section" class="hidden">
      <nav class="nav-tabs">
        <button type="button" class="tab active" data-page="tag">Tag</button>
        <button type="button" class="tab" data-page="leaderboard">Leaderboard</button>
        <button type="button" class="tab" data-page="notifications">Notifications</button>
      </nav>

      <div id="page-tag" class="page">
        <div class="grid">
          <div class="card profile-card">
            <div class="profile-top">
              <img id="player-avatar" class="avatar" src="" alt="Your avatar" />
              <div>
                <h2 style="margin: 0;">Welcome, <span id="player-name"></span></h2>
                <div class="muted">Account name: <span id="player-handle"></span></div>
                <div class="muted">Score: <span id="player-score">0</span></div>
              </div>
            </div>
            <div class="upload-controls">
              <label class="muted" for="avatar-input">Update avatar (max 2MB)</label>
              <input id="avatar-input" type="file" accept="image/*">
              <button type="button" id="upload-avatar-btn" class="secondary">Upload Avatar</button>
            </div>
            <div class="nickname-controls">
              <label for="nickname-input">Nickname <span class="muted">(optional)</span></label>
              <input id="nickname-input" placeholder="Enter nickname" maxlength="40">
              <button type="button" id="save-nickname-btn">Save Nickname</button>
            </div>
            <button type="button" id="logout-btn" class="secondary" style="margin-top: 1rem; max-width: 160px;">Logout</button>
          </div>

          <div class="card">
            <h3 style="margin-top: 0;">Your Current Target</h3>
            <p id="target-wrapper">
              <span id="target-name">No target yet.</span>
            </p>
            <label for="tag-message">Optional message to everyone</label>
            <textarea id="tag-message" placeholder="Share the story (max 280 characters)"></textarea>
            <button type="button" id="tag-btn">Tag Successful</button>
            <div class="muted" style="margin-top: 0.5rem;">
              Next tag available in: <span id="tag-cooldown">Ready</span>
            </div>
          </div>

          <div id="admin-panel" class="card admin-only hidden">
            <div class="flex" style="justify-content: space-between;">
              <h2 style="margin: 0;">Admin Controls <span class="pill">Admin</span></h2>
              <button type="button" id="load-mapping" class="secondary" style="max-width: 150px;">View Current Mapping</button>
            </div>
            <form id="init-form">
              <label for="init-names">Players (one per line)</label>
              <textarea id="init-names" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
              <div class="flex">
                <label class="flex" style="gap: 0.35rem; margin: 0;">
                  <input type="checkbox" id="init-shuffle" checked>
                  Shuffle order
                </label>
                <span class="muted">Requires at least 2 names.</span>
              </div>
              <button type="submit" class="danger">Start / Reset Game</button>
            </form>
            <div id="mapping-view" class="hidden">
              <h3 style="margin-bottom: 0.5rem;">Target Mapping</h3>
              <table>
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Active</th>
                    <th>Target</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody id="mapping-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="page-leaderboard" class="page hidden">
        <div class="card">
          <div class="flex" style="justify-content: space-between;">
            <h2 style="margin: 0;">Leaderboard</h2>
            <button type="button" id="refresh-leaderboard" class="secondary" style="max-width: 140px;">Refresh</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Player</th>
                <th>Score</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body">
            </tbody>
          </table>
        </div>
      </div>

      <div id="page-notifications" class="page hidden">
        <div class="card">
          <div class="flex" style="justify-content: space-between;">
            <h2 style="margin: 0;">Notifications</h2>
            <button type="button" id="refresh-notifications" class="secondary" style="max-width: 160px;">Refresh</button>
          </div>
          <div id="notifications-empty" class="muted" style="margin-top: 0.75rem;">No notifications yet.</div>
          <ul id="notifications-list" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="%232563eb"/><text x="60" y="72" font-size="48" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif">GW</text></svg>';
    const state = {
      token: null,
      user: null,
      ws: null,
      wsTicker: null,
      leaders: [],
      notifications: [],
      currentPage: "tag",
      cooldownSeconds: 0,
      cooldownTimer: null,
    };

    function showStatus(message, type = "info") {
      const box = document.getElementById("status");
      if (!message) {
        box.classList.add("hidden");
        box.textContent = "";
        return;
      }
      box.textContent = message;
      box.className = "status";
      if (type === "error") {
        box.classList.add("error");
      } else if (type === "success") {
        box.classList.add("success");
      }
      box.classList.remove("hidden");
    }

    function toggleSections(loggedIn) {
      document.getElementById("auth-section").classList.toggle("hidden", loggedIn);
      document.getElementById("game-section").classList.toggle("hidden", !loggedIn);
    }

    function setUser(user) {
      state.user = user;
      const displayName = user ? (user.nickname || user.name || "") : "";
      document.getElementById("player-name").textContent = displayName;
      document.getElementById("player-handle").textContent = user?.name ?? "";
      document.getElementById("player-score").textContent = user?.score ?? 0;
      updateAvatarDisplay(user?.avatar_url);
      const adminPanel = document.getElementById("admin-panel");
      adminPanel.classList.toggle("hidden", !user?.is_admin);
      const nicknameInput = document.getElementById("nickname-input");
      if (nicknameInput) {
        nicknameInput.value = user?.nickname ?? "";
      }
      if (!user) {
        setCooldown(0);
      } else if (typeof user.cooldown_seconds === "number") {
        setCooldown(user.cooldown_seconds);
      } else {
        setCooldown(state.cooldownSeconds);
      }
    }

    function updateAvatarDisplay(url) {
      const img = document.getElementById("player-avatar");
      if (img) {
        img.src = url || DEFAULT_AVATAR;
      }
    }

    function switchPage(page) {
      state.currentPage = page;
      document.querySelectorAll(".nav-tabs .tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.page === page);
      });
      const pages = {
        tag: document.getElementById("page-tag"),
        leaderboard: document.getElementById("page-leaderboard"),
        notifications: document.getElementById("page-notifications"),
      };
      Object.entries(pages).forEach(([name, el]) => {
        el.classList.toggle("hidden", name !== page);
      });
    }

    function updateCooldownDisplay() {
      const label = document.getElementById("tag-cooldown");
      const button = document.getElementById("tag-btn");
      if (!label || !button) return;
      if (state.cooldownSeconds <= 0) {
        label.textContent = "Ready";
        button.disabled = false;
        return;
      }
      const minutes = Math.floor(state.cooldownSeconds / 60);
      const seconds = state.cooldownSeconds % 60;
      label.textContent = `${minutes}:${seconds.toString().padStart(2, "0")}`;
      button.disabled = true;
    }

    function setCooldown(seconds) {
      const value = Number.isFinite(seconds) && seconds > 0 ? Math.ceil(seconds) : 0;
      state.cooldownSeconds = value;
      if (state.cooldownTimer) {
        clearInterval(state.cooldownTimer);
        state.cooldownTimer = null;
      }
      updateCooldownDisplay();
      if (state.cooldownSeconds > 0) {
        state.cooldownTimer = setInterval(() => {
          if (state.cooldownSeconds <= 1) {
            state.cooldownSeconds = 0;
            clearInterval(state.cooldownTimer);
            state.cooldownTimer = null;
          } else {
            state.cooldownSeconds -= 1;
          }
          updateCooldownDisplay();
        }, 1000);
      }
    }

    function formatCooldown(seconds) {
      const total = Math.max(0, Math.ceil(seconds));
      const minutes = Math.floor(total / 60);
      const secs = total % 60;
      if (minutes > 0) {
        return `${minutes} minute${minutes === 1 ? "" : "s"} ${secs} second${secs === 1 ? "" : "s"}`;
      }
      return `${secs} second${secs === 1 ? "" : "s"}`;
    }

    function renderLeaderboard(leaders) {
      state.leaders = leaders;
      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = "";
      if (!leaders.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.textContent = "No players yet.";
        row.appendChild(cell);
        tbody.appendChild(row);
        return;
      }
      leaders.forEach((leader, idx) => {
        const row = document.createElement("tr");
        const rank = document.createElement("td");
        rank.textContent = idx + 1;
        rank.className = "leaderboard-rank";
        const name = document.createElement("td");
        const nameWrap = document.createElement("div");
        nameWrap.className = "player-cell";
        const avatar = document.createElement("img");
        avatar.className = "avatar small";
        avatar.src = leader.avatar_url || DEFAULT_AVATAR;
        avatar.alt = `${leader.name}'s avatar`;
        const nameText = document.createElement("span");
        const displayName = leader.nickname || leader.name;
        nameText.textContent = displayName;
        nameWrap.append(avatar, nameText);
        if (leader.nickname) {
          const handle = document.createElement("span");
          handle.className = "small-handle";
          handle.textContent = `(@${leader.name})`;
          nameWrap.appendChild(handle);
        }
        name.appendChild(nameWrap);
        const score = document.createElement("td");
        score.textContent = leader.score;
        const status = document.createElement("td");
        status.textContent = leader.active ? "Active" : "Out";
        status.style.fontWeight = leader.active ? "600" : "400";
        row.append(rank, name, score, status);
        tbody.appendChild(row);
      });
    }

    function renderMapping(mapping) {
      const wrapper = document.getElementById("mapping-view");
      const tbody = document.getElementById("mapping-body");
      if (!mapping.length) {
        tbody.innerHTML = "<tr><td colspan='4'>No mapping available.</td></tr>";
      } else {
        tbody.innerHTML = "";
        mapping.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.player}</td>
            <td>${item.active ? "Yes" : "No"}</td>
            <td>${item.target ?? "-"}</td>
            <td>${item.score}</td>
          `;
          tbody.appendChild(row);
        });
      }
      wrapper.classList.remove("hidden");
    }

    function renderNotifications(list) {
      state.notifications = list;
      const wrapper = document.getElementById("notifications-list");
      const empty = document.getElementById("notifications-empty");
      wrapper.innerHTML = "";
      if (!list.length) {
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      list.forEach((item) => {
        const li = document.createElement("li");
        li.style.padding = "0.75rem 0";
        li.style.borderBottom = "1px solid #e2e8f0";
        const heading = document.createElement("div");
        heading.style.fontWeight = "600";
        const headerWrap = document.createElement("div");
        headerWrap.className = "player-cell";
        const avatar = document.createElement("img");
        avatar.className = "avatar small";
        avatar.src = item.tagger_avatar || DEFAULT_AVATAR;
        avatar.alt = `${item.tagger || "Player"} avatar`;
        const taggerName = item.tagger_nickname || item.tagger || "Someone";
        const targetName = item.target ?? "their target";
        const text = document.createElement("span");
        text.textContent = `${taggerName} tagged ${targetName}`;
        headerWrap.append(avatar, text);
        if (item.tagger_nickname && item.tagger) {
          const handle = document.createElement("span");
          handle.className = "small-handle";
          handle.textContent = `(@${item.tagger})`;
          headerWrap.appendChild(handle);
        }
        heading.appendChild(headerWrap);
        const message = document.createElement("div");
        message.style.marginTop = "0.25rem";
        if (item.message) {
          message.textContent = item.message;
        } else {
          message.textContent = "(no message)";
          message.classList.add("muted");
        }
        const time = document.createElement("div");
        time.className = "muted";
        time.style.marginTop = "0.25rem";
        const date = new Date(item.created_at);
        time.textContent = Number.isNaN(date.getTime()) ? item.created_at : date.toLocaleString();
        li.append(heading, message, time);
        wrapper.appendChild(li);
      });
    }

    async function api(path, options = {}) {
      const opts = {
        method: options.method || "GET",
        headers: Object.assign({}, options.headers || {}),
      };
      if (state.token) {
        opts.headers["Authorization"] = `Bearer ${state.token}`;
      }
      if (options.body !== undefined) {
        if (options.body instanceof FormData) {
          opts.body = options.body;
        } else {
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(options.body);
        }
      }
      const res = await fetch(path, opts);
      if (!res.ok) {
        let detail = res.statusText;
        let cooldownSeconds;
        try {
          const payload = await res.json();
          if (payload?.detail) {
            const info = payload.detail;
            if (info && typeof info === "object") {
              if (typeof info.message === "string") {
                detail = info.message;
              } else {
                detail = JSON.stringify(info);
              }
              if (typeof info.cooldown_seconds === "number") {
                cooldownSeconds = info.cooldown_seconds;
              }
            } else {
              detail = info;
            }
          } else {
            detail = JSON.stringify(payload);
          }
        } catch (_) {
          // ignore json parse errors
        }
        const error = new Error(detail || `Request failed (${res.status})`);
        if (typeof cooldownSeconds === "number") {
          error.cooldownSeconds = cooldownSeconds;
        }
        throw error;
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function playZap() {
      const layer = document.getElementById("zap-layer");
      if (!layer) return;
      layer.innerHTML = "";
      layer.classList.add("active");

      const flash = document.createElement("div");
      flash.className = "zap-flash";
      layer.appendChild(flash);

      const spawnBolt = () => {
        const bolt = document.createElement("div");
        bolt.className = "zap-bolt";
        const offset = (Math.random() * 200 - 100) + "%";
        const skew = (Math.random() * 40 - 20) + "deg";
        bolt.style.setProperty("--bolt-x", offset);
        bolt.style.setProperty("--bolt-skew", skew);
        bolt.style.left = Math.random() * 100 + "%";
        layer.appendChild(bolt);
        setTimeout(() => bolt.remove(), 700);
      };

      spawnBolt();
      const boltTimer = setInterval(spawnBolt, 600);

      setTimeout(() => {
        clearInterval(boltTimer);
        layer.classList.remove("active");
        layer.innerHTML = "";
      }, 5000);
    }

    async function refreshMe() {
      if (!state.token) return;
      try {
        const me = await api("/me");
        setUser(me);
        toggleSections(true);
        switchPage(state.currentPage || "tag");
      } catch (err) {
        console.warn("Failed to refresh session:", err);
        logout(false);
      }
    }

    async function refreshTarget() {
      if (!state.token) return;
      try {
        const res = await api("/target");
        const tgt = document.getElementById("target-name");
        if (!res.target) {
          tgt.textContent = "No target assigned yet.";
        } else {
          tgt.textContent = res.target;
        }
      } catch (err) {
        showStatus(`Failed to load target: ${err.message}`, "error");
      }
    }

    async function refreshLeaderboard() {
      try {
        const { leaders } = await api("/leaderboard");
        renderLeaderboard(leaders);
      } catch (err) {
        showStatus(`Failed to load leaderboard: ${err.message}`, "error");
      }
    }

    async function refreshNotifications() {
      try {
        const { notifications } = await api("/notifications");
        renderNotifications(notifications);
      } catch (err) {
        showStatus(`Failed to load notifications: ${err.message}`, "error");
      }
    }

    function connectLeaderboardSocket() {
      if (state.ws) {
        state.ws.close();
      }
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${protocol}://${window.location.host}/ws/leaderboard`);
      state.ws = ws;
      ws.addEventListener("open", () => {
        if (state.wsTicker) {
          clearInterval(state.wsTicker);
        }
        state.wsTicker = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send("ping");
          }
        }, 25000);
      });
      ws.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === "leaderboard" && payload.leaders) {
            renderLeaderboard(payload.leaders);
          } else if (payload.type === "notifications" && payload.notifications) {
            renderNotifications(payload.notifications);
          } else if (payload.type === "notification" && payload.notification) {
            const updated = [payload.notification, ...state.notifications].slice(0, 50);
            renderNotifications(updated);
          }
        } catch (err) {
          console.error("Invalid WS payload", err);
        }
      });
      ws.addEventListener("close", () => {
        if (state.wsTicker) {
          clearInterval(state.wsTicker);
          state.wsTicker = null;
        }
        state.ws = null;
        setTimeout(connectLeaderboardSocket, 3000);
      });
    }

    function persistToken(token) {
      state.token = token;
      if (token) {
        localStorage.setItem("gotcha_token", token);
      } else {
        localStorage.removeItem("gotcha_token");
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const form = event.target;
      const data = {
        name: form.name.value.trim(),
        password: form.password.value,
        admin_secret: form.admin_secret.value.trim() || null,
      };
      if (!data.name) {
        showStatus("Name is required", "error");
        return;
      }
      if (!data.password || data.password.length < 6) {
        showStatus("Password must be at least 6 characters.", "error");
        return;
      }
      if (data.password.length > 72) {
        showStatus("Password must be at most 72 characters.", "error");
        return;
      }
      try {
        const res = await api("/register", { method: "POST", body: data });
        persistToken(res.token);
        showStatus("Registered successfully!", "success");
        form.reset();
        await refreshMe();
        await refreshTarget();
      } catch (err) {
        showStatus(`Registration failed: ${err.message}`, "error");
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const form = event.target;
      const name = form.name.value.trim();
      const password = form.password.value;
      if (!name) {
        showStatus("Name is required", "error");
        return;
      }
      if (!password) {
        showStatus("Password is required", "error");
        return;
      }
      if (password.length > 72) {
        showStatus("Password must be at most 72 characters.", "error");
        return;
      }
      try {
        const res = await api("/login", { method: "POST", body: { name, password } });
        persistToken(res.token);
        showStatus("Logged in successfully!", "success");
        form.reset();
        await refreshMe();
        await refreshTarget();
      } catch (err) {
        showStatus(`Login failed: ${err.message}`, "error");
      }
    }

    async function handleTag() {
      if (!state.token) return;
      const messageInput = document.getElementById("tag-message");
      const message = messageInput.value.trim();
      if (message.length > 280) {
        showStatus("Message must be 280 characters or less.", "error");
        return;
      }
      const body = message ? { message } : {};
      try {
        const res = await api("/tag", { method: "POST", body });
        document.getElementById("player-score").textContent = res.score;
        document.getElementById("target-name").textContent = res.new_target || "No target assigned.";
        if (res.notification) {
          const updated = [res.notification, ...state.notifications].slice(0, 50);
          renderNotifications(updated);
        }
        messageInput.value = "";
        if (typeof res.cooldown_seconds === "number") {
          setCooldown(res.cooldown_seconds);
        }
        playZap();
        showStatus("Tag recorded!", "success");
      } catch (err) {
        if (typeof err.cooldownSeconds === "number") {
          setCooldown(err.cooldownSeconds);
          showStatus(`On cooldown — try again in ${formatCooldown(err.cooldownSeconds)}.`, "error");
          return;
        }
        showStatus(`Tag failed: ${err.message}`, "error");
      }
    }

    async function handleAvatarUpload() {
      const input = document.getElementById("avatar-input");
      if (!input.files || !input.files.length) {
        showStatus("Choose an image first.", "error");
        return;
      }
      const file = input.files[0];
      if (file.size > 2 * 1024 * 1024) {
        showStatus("Avatar must be 2MB or less.", "error");
        return;
      }
      const form = new FormData();
      form.append("file", file);
      try {
        const res = await api("/me/avatar", { method: "POST", body: form });
        if (state.user) {
          setUser(Object.assign({}, state.user, { avatar_url: res.avatar_url }));
        }
        await refreshLeaderboard();
        input.value = "";
        showStatus("Avatar updated!", "success");
      } catch (err) {
        showStatus(`Failed to upload avatar: ${err.message}`, "error");
      }
    }

    async function handleNicknameSave() {
      if (!state.token) {
        showStatus("Log in before setting a nickname.", "error");
        return;
      }
      const input = document.getElementById("nickname-input");
      if (!input) return;
      const nickname = input.value.trim();
      if (nickname.length > 40) {
        showStatus("Nickname must be 40 characters or fewer.", "error");
        return;
      }
      try {
        const res = await api("/me/nickname", {
          method: "POST",
          body: { nickname: nickname || null },
        });
        const updated = Object.assign({}, state.user || {}, {
          nickname: res.nickname || null,
          cooldown_seconds: state.cooldownSeconds,
        });
        setUser(updated);
        showStatus("Nickname updated!", "success");
      } catch (err) {
        showStatus(`Failed to update nickname: ${err.message}`, "error");
      }
    }

    async function handleInit(event) {
      event.preventDefault();
      const namesRaw = document.getElementById("init-names").value
        .split(/\r?\n/)
        .map(v => v.trim())
        .filter(Boolean);
      const shuffle = document.getElementById("init-shuffle").checked;
      if (namesRaw.length < 2) {
        showStatus("Need at least two players", "error");
        return;
      }
      try {
        await api("/admin/init", {
          method: "POST",
          body: { players: namesRaw, shuffle },
        });
        showStatus("Game initialized!", "success");
        document.getElementById("mapping-view").classList.add("hidden");
        await refreshTarget();
        await refreshLeaderboard();
      } catch (err) {
        showStatus(`Failed to initialize: ${err.message}`, "error");
      }
    }

    async function handleLoadMapping() {
      try {
        const res = await api("/admin/mapping");
        renderMapping(res.mapping);
      } catch (err) {
        showStatus(`Failed to load mapping: ${err.message}`, "error");
      }
    }

    function logout(notify = true) {
      persistToken(null);
      setUser(null);
      toggleSections(false);
      document.getElementById("target-name").textContent = "No target yet.";
      renderNotifications([]);
      document.getElementById("tag-message").value = "";
      document.getElementById("player-name").textContent = "";
      document.getElementById("player-handle").textContent = "";
      const avatarInput = document.getElementById("avatar-input");
      if (avatarInput) {
        avatarInput.value = "";
      }
      const nicknameInput = document.getElementById("nickname-input");
      if (nicknameInput) {
        nicknameInput.value = "";
      }
      renderLeaderboard([]);
      switchPage("tag");
      if (notify) {
        showStatus("Logged out.", "success");
      } else {
        showStatus(null);
      }
    }

    function init() {
      document.getElementById("register-form").addEventListener("submit", handleRegister);
      document.getElementById("login-form").addEventListener("submit", handleLogin);
      document.getElementById("tag-btn").addEventListener("click", handleTag);
      document.getElementById("refresh-notifications").addEventListener("click", refreshNotifications);
      document.getElementById("init-form").addEventListener("submit", handleInit);
      document.getElementById("load-mapping").addEventListener("click", handleLoadMapping);
      document.getElementById("refresh-leaderboard").addEventListener("click", refreshLeaderboard);
      document.getElementById("logout-btn").addEventListener("click", () => logout(true));
      document.getElementById("upload-avatar-btn").addEventListener("click", handleAvatarUpload);
      document.getElementById("save-nickname-btn").addEventListener("click", handleNicknameSave);
      document.querySelectorAll(".nav-tabs .tab").forEach((tab) => {
        tab.addEventListener("click", () => switchPage(tab.dataset.page));
      });

      const stored = localStorage.getItem("gotcha_token");
      if (stored) {
        persistToken(stored);
        refreshMe().then(refreshTarget);
      }
      switchPage("tag");
      refreshLeaderboard();
      refreshNotifications();
      connectLeaderboardSocket();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
