name: Build and push BETA image

on:
  push:
    branches: [notification-rework]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rockhardinsighting276/jchgotchaweek26:beta
            ghcr.io/rockhardinsighting276/jchgotchaweek26:${{ github.sha }}
